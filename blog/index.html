---
layout: default
---

<h4>blog</h4>
{% for post in site.posts %}
	<time>{{ post.date | date: "%b %-d, %Y" }}</time>
	<h3><a href="{{ post.url | prepend: site.baseurl }}">{{ post.title }}</a></h3>
	{% if entry.excerpt %}
        	{{ post.excerpt | markdownify }}
        <div class="more-link">
          <a href="{{ post.url | relative_url }}">{{ site.data.text[site.locale].read_more | default: 'Read More' }}</a>
        </div>
      {% endif %}{% endfor %}
