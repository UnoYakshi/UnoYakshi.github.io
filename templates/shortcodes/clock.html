<div class="container">
    <div class="clock">
        <!-- Hands...-->
        <div style="--clr:#222; --h:90px; --w:6px;" id="hour" class="hand"><i class="hand-hour"></i></div>
        <div style="--clr:#333; --h:96px; --w:4px;" id="min" class="hand"><i class="hand-min"></i></div>
        <div style="--clr:#dedede; --h:106px; --w:2px;" id="sec" class="hand"><i class="hand-sec"></i></div>

        <!-- Hours...-->
        <span style="--i:1;"><b>1</b></span>
        <span style="--i:2;"><b>2</b></span>
        <span style="--i:3;"><b>3</b></span>
        <span style="--i:4;"><b>4</b></span>
        <span style="--i:5;"><b>5</b></span>
        <span style="--i:6;"><b>6</b></span>
        <span style="--i:7;"><b>7</b></span>
        <span style="--i:8;"><b>8</b></span>
        <span style="--i:9;"><b>9</b></span>
        <span style="--i:10;"><b>10</b></span>
        <span style="--i:11;"><b>11</b></span>
        <span style="--i:12;"><b>12</b></span>
    </div>
</div>

<style>
.container {
    display: flex;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: sans-serif;
    color: #dedede;
    align-items: center;
    justify-content: center;
    position: relative;
}
.clock {
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background-color: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.25);
    box-shadow: 0px 0px 30px rgba(0,0,0,0.9);
    display: flex;
    justify-content: center;
    align-items: center;
}
.clock span {
    position: absolute;
    transform: rotate(calc(30deg * var(--i) ));
    inset: 12px;
    text-align: center;
}
.clock span::before {
    content: "";
    position: absolute;
    top: -11px; left: 50%;
    width: 2px;
    height: 6px;
    background: rgba(255,255,255,0.25);
    transform: translateX(-50%);
}
.clock span b {
    transform: rotate(calc(-30deg * var(--i)));
    display: inline-block;
    font-size: 20px;
}
.clock::before {
    content:'';
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background-color: #dedede;
    z-index: 2;
}
.hand {
    position: absolute;
    display: flex;
    justify-content: center;
    align-items: flex-end;
}
.hand i {
    position: absolute;
    background-color: var(--clr);
    width: var(--w);
    height: var(--h);
    border-radius: 8px;
}
</style>

<script>
let hr = document.getElementById('hour');
let sec = document.getElementById('sec');
let min = document.getElementById('min');

function displayTime()
{
    let date = new Date(new Date().toLocaleString('en', {timeZone: 'Europe/Helsinki'}));
    let hh = date.getHours();
    let mm = date.getMinutes();
    let ss = date.getSeconds();
    let hRotation = 30 * hh + mm / 2;
    let mRotation = 6 * mm;
    let sRotation = 6 * ss;

    hr.style.transform=`rotate(${hRotation}deg)`;
    min.style.transform=`rotate(${mRotation}deg)`;
    sec.style.transform=`rotate(${sRotation}deg)`;
}

setInterval(displayTime,1000);
</script>
