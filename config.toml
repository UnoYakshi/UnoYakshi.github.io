# The URL the site will be built for
base_url = "https://yakshi.uno"

compile_sass = true
build_search_index = true
generate_robots_txt = true
generate_feeds = true

theme = "duckquill"
title = "UnoYakshi"
description = "This is our home now"

[markdown]
extra_syntaxes_and_themes = [
    "highlight_themes",
]

highlight_code = true
highlight_theme = "Darkula"
render_emoji = true
smart_punctuation = true

[search]
include_title = true
include_date = true
include_path = true
include_content = true
include_description = true
index_format = "elasticlunr_javascript"

[extra]
hard_breaks = true
default_theme = "dark"
accent_color = "#dedede"
accent_color_dark = "#808080"
lang = "en"
codeblock = true
show_copy_button = true
show_theme_switcher = true
katex = true
enable_search = true
toc = true
toc_sidebar = true

styles = [
    "mods.css",
]

[extra.nav]
links = [
    { url = "/", name = "Home" },
    { url = "/about", name = "About" },
    { url = "/blog", name = "Blog" }
]
